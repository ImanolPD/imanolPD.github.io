<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Culturistas Famosos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Listado de Culturistas Famosos</h1>
        <input type="text" id="search-input" placeholder="Buscar culturistas...">

    <main>
        <div id="lista-culturistas" class="contenedor-grid"></div>

            <button class="boton-pagina" id="next">Siguiente</button>
        </div>
    </main>
